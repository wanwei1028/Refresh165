name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 校验版本号与 tag 一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(grep '^versionName=' version.properties | cut -d= -f2)
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "版本不一致: version.properties=$v, tag=${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "版本一致: v$v"

      - name: 构建 APK
        run: |
          chmod +x build.sh
          ANDROID_SDK="$ANDROID_HOME" BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0" ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Refresh165-apk
          path: out/Refresh165-v*.apk
