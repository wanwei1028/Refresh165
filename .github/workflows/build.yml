name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.ver.outputs.name }}
      version_code: ${{ steps.ver.outputs.code }}
      release_key: ${{ steps.signing.outputs.available }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 回归测试
        run: python3 tests/regression.py

      - name: Xposed 适配层测试
        run: python3 tests/xposed_adapter.py

      - name: 视频前台判定测试
        run: python3 tests/video_fixed.py

      - name: 读取版本号
        id: ver
        run: |
          v=$(grep '^versionName=' version.properties | cut -d= -f2)
          c=$(grep '^versionCode=' version.properties | cut -d= -f2)
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$c" >> "$GITHUB_OUTPUT"

      - name: 校验版本号与 tag 一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${{ steps.ver.outputs.name }}"
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "版本不一致: version.properties=$v, tag=${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "版本一致: v$v"

      - name: 安装 Android SDK 组件
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 准备签名密钥
        id: signing
        if: github.event_name == 'push'
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: |
          if [ -n "${KS_BASE64:-}" ]; then
            echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "使用仓库 Secrets 中的发布密钥"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "未配置 KS_BASE64，将生成临时密钥（产物仅用于验证，不能覆盖正式版）"
          fi

      - name: 构建 APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          chmod +x build.sh
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0" \
          KS_PASS="${KS_PASS:-modpass}" \
          KS_ALIAS="${KS_ALIAS:-modkey}" \
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Refresh165-v${{ steps.ver.outputs.name }}
          path: out/Refresh165-v*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.apk.outputs.release_key == 'true'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Refresh165-v${{ needs.apk.outputs.version_name }}
          path: out

      - name: 生成更新日志
        run: |
          v="v${{ needs.apk.outputs.version_name }}"
          notes="$RUNNER_TEMP/notes.md"
          awk -v ver="## $v" '
            $0 == ver { flag=1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "CHANGELOG.md 中没有 $v 段落，使用默认说明" >&2
            echo "$v" > "$notes"
          fi
          # 去掉开头空行
          sed -i '/./,$!d' "$notes"
          {
            echo ""
            echo "---"
            echo ""
            echo "版本：$v（versionCode ${{ needs.apk.outputs.version_code }}）"
            echo "作用域：android / system / com.android.settings"
            echo "构建：GitHub Actions 自动构建，使用与历史版本相同的签名密钥"
          } >> "$notes"
          echo "---- notes ----"; cat "$notes"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/Refresh165-v*.apk
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: false
